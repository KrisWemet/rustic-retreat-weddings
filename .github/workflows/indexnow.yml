name: Notify Bing of changes (IndexNow)

# After Vercel finishes a production deploy, send the sitemap's pages to
# IndexNow so Bing (which ChatGPT search draws on) recrawls them the same day.
# Preview deploys are skipped. "Run workflow" in the Actions tab sends them by hand
# (tick "dry run" to only print what would be sent).
on:
  deployment_status:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: only print what would be sent"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  indexnow:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       (github.event.deployment.production_environment ||
        startsWith(github.event.deployment.environment, 'Production')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node scripts/indexnow.mjs ${{ inputs.dry_run && '--dry-run' || '' }}
